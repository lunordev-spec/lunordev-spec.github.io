<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunor Tech | Building the Future</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-glow: radial-gradient(circle at 50% 50%, rgba(50, 100, 255, 0.15), transparent 60%);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        .glow-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent-glow);
            z-index: -1;
            animation: pulse 8s ease-in-out infinite;
        }

        /* Main Container */
        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            z-index: 10;
        }

        /* Logo / Brand Name */
        .brand-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        /* Headline */
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        /* Projects Grid (Glassmorphism) */
        .ecosystem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: default;
        }

        .project-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .project-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        .project-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: #444;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .brand-name { font-size: 2.5rem; }
            .ecosystem-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <div class="status-badge">System Under Development</div>
        <div class="brand-name">Lunor Tech</div>
        <h1>Crafting digital experiences for the modern world.</h1>

        <div class="ecosystem-grid">
                    <a href="advora.html" style="text-decoration: none; color: inherit;">
                <div class="project-card">
                    <span class="project-title">Advora</span>
                    <span class="project-desc">Study & Social Ecosystem</span>
                </div>
            </a>

            <a href="quizzy.html" style="text-decoration: none; color: inherit;">
                <div class="project-card">
                    <span class="project-title">Quizzy AI</span>
                    <span class="project-desc">Smart Quiz Generate intelligence</span>
                </div>
            </a>
            
            <div class="project-card">
                <span class="project-title">DataX</span>
                <span class="project-desc">Secure Data Solutions</span>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Lunor Tech. All Systems Operational.
    </footer>

</body>
  </html>
